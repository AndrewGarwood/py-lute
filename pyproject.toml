[project]
name = "lute"
version = "0.1.0"
description = "Logging utilities"
readme = "README.md"
authors = [
    { name = "Andrew Garwood", email = "andrew.garwood.949@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
lute = "lute:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
